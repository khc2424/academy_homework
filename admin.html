<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 대시보드</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary:#4f46e5; --primary-light:#eef2ff;
      --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
      --bg:#f9fafb; --card:#fff; --border:#e5e7eb;
      --text:#1f2937; --text-sub:#4b5563; --text-muted:#9ca3af;
      --input-bg:#fff;
    }
    body.dark {
      --primary:#818cf8; --primary-light:#1e1b4b;
      --gray-50:#1a2235; --gray-100:#222d42; --gray-200:#2e3d57;
      --bg:#111827; --card:#1e293b; --border:#334155;
      --text:#f1f5f9; --text-sub:#94a3b8; --text-muted:#64748b;
      --input-bg:#1e293b;
    }
    body { background:var(--bg); font-family:'Segoe UI','Malgun Gothic',sans-serif; color:var(--text); transition:background .2s,color .2s; }

    /* 사이드바 */
    .sidebar { width:220px; min-height:100vh; background:var(--card); border-right:1px solid var(--border); position:fixed; top:0; left:0; z-index:100; transition:width .25s,box-shadow .25s,background .2s; overflow:hidden; }
    .sidebar.collapsed { width:0; box-shadow:none; }
    .sidebar-brand { background:var(--primary); color:#fff; padding:20px 16px; font-weight:700; font-size:15px; white-space:nowrap; display:flex; align-items:center; justify-content:space-between; }
    .sidebar-brand span { display:block; font-size:11px; font-weight:400; opacity:.75; margin-top:2px; }
    .hamburger-btn { background:none; border:none; color:#fff; cursor:pointer; padding:4px 6px; border-radius:6px; display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
    .hamburger-btn span { display:block; width:18px; height:2px; background:#fff; border-radius:2px; }
    .hamburger-btn:hover { background:rgba(255,255,255,.15); }
    .sidebar-toggle-ext { position:fixed; top:14px; left:12px; z-index:200; background:var(--primary); border:none; color:#fff; border-radius:8px; padding:8px 10px; cursor:pointer; display:none; flex-direction:column; gap:4px; box-shadow:0 2px 8px rgba(79,70,229,.4); }
    .sidebar-toggle-ext span { display:block; width:18px; height:2px; background:#fff; border-radius:2px; }
    .nav-btn { display:flex; align-items:center; gap:10px; padding:11px 18px; color:var(--text-sub); cursor:pointer; border-radius:8px; margin:2px 8px; font-size:14px; transition:all .15s; border:none; background:none; width:calc(100% - 16px); text-align:left; white-space:nowrap; }
    .nav-btn:hover { background:var(--primary-light); color:var(--primary); }
    .nav-btn.active { background:var(--primary-light); color:var(--primary); font-weight:600; }

    /* 메인 */
    .main { margin-left:220px; padding:28px 32px; transition:margin-left .25s; }
    .main.expanded { margin-left:0; padding-left:60px; }
    .page { display:none; } .page.active { display:block; }
    .page-title { font-size:22px; font-weight:700; margin-bottom:6px; }
    .page-sub { font-size:13px; color:var(--text-sub); margin-bottom:20px; }

    /* 카드 */
    .card-c { background:var(--card); border-radius:12px; border:1px solid var(--border); margin-bottom:16px; overflow:hidden; transition:background .2s; }
    .card-h { padding:14px 20px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; }

    /* 테이블 */
    .tbl { width:100%; font-size:13.5px; border-collapse:collapse; }
    .tbl thead th { background:var(--gray-50); font-weight:600; color:var(--text-sub); font-size:12px; border-bottom:1px solid var(--border); padding:10px 14px; }
    .tbl tbody td { padding:11px 14px; vertical-align:middle; border-bottom:1px solid var(--border); color:var(--text); }
    .tbl tbody tr:last-child td { border-bottom:none; }
    .tbl tbody tr:hover { background:var(--gray-50); }

    /* 버튼 */
    .btn-p { background:var(--primary); border:none; color:#fff; border-radius:8px; padding:8px 16px; font-size:13.5px; font-weight:500; cursor:pointer; }
    .btn-p:hover { background:#4338ca; }
    .btn-o { border:1px solid var(--border); background:var(--card); color:var(--text-sub); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
    .btn-o:hover { background:var(--gray-50); }
    .btn-d { background:#fee2e2; border:none; color:#991b1b; border-radius:8px; padding:6px 14px; font-size:13px; font-weight:500; cursor:pointer; }
    .btn-d:hover { background:#fecaca; }

    /* 인풋 */
    .fc { border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13.5px; width:100%; outline:none; background:var(--input-bg); color:var(--text); transition:background .2s,border .2s; }
    .fc:focus { border-color:var(--primary); }

    /* 프로그레스 */
    .prog { background:var(--gray-200); border-radius:99px; height:8px; overflow:hidden; }
    .prog-f { height:100%; border-radius:99px; transition:width .5s; }

    /* 배지 */
    .badge-admin { background:#fef3c7; color:#92400e; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:600; }
    .badge-teacher { background:#dcfce7; color:#166534; border-radius:20px; padding:2px 10px; font-size:12px; font-weight:600; }
    .summary-chip { background:var(--primary-light); color:var(--primary); border-radius:8px; padding:5px 12px; font-size:13px; font-weight:600; }

    /* 모달 */
    .modal-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:999; align-items:center; justify-content:center; }
    .modal-ov.show { display:flex; }
    .modal-bx { background:var(--card); border-radius:16px; width:400px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .modal-hd { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .modal-bd { padding:20px 24px; }
    .modal-ft { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }

    /* 로그인 */
    .login-screen { position:fixed; inset:0; background:var(--gray-50); display:flex; align-items:center; justify-content:center; z-index:9999; }
    .login-box { background:var(--card); border-radius:16px; padding:40px; width:360px; box-shadow:0 8px 32px rgba(0,0,0,.15); text-align:center; }

    /* Toast */
    .toast-c { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px; }
    .toast-i { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px 16px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.15); animation:slideIn .3s ease; }
    @keyframes slideIn { from{transform:translateX(60px);opacity:0} to{transform:translateX(0);opacity:1} }

    /* 선생님 탭 */
    .teacher-tab { display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 18px; border-radius:10px; border:2px solid var(--border); background:var(--card); color:var(--text-sub); font-weight:500; cursor:pointer; font-size:14px; transition:all .15s; white-space:nowrap; }
    .teacher-tab.active { border-color:var(--primary); background:var(--primary-light); color:var(--primary); font-weight:700; }
    .teacher-tab:hover:not(.active) { border-color:var(--primary); background:var(--primary-light); }

    /* 반 블록 */
    .class-block { border:1px solid var(--border); border-radius:10px; padding:14px 18px; margin-bottom:12px; }

    /* 섹션 박스 (제출/연장/미제출) */
    .sec-box { background:var(--card); border-radius:8px; padding:10px 12px; border:1px solid var(--border); }
    .sec-label { font-size:11px; font-weight:700; margin-bottom:8px; }

    /* 이름 2열 그리드 */
    .name-grid { display:grid; grid-template-columns:1fr 1fr; gap:3px 6px; }

    /* 클릭 가능한 이름 칩 */
    .name-chip { font-size:12.5px; padding:4px 8px; border-radius:6px; cursor:pointer; border:1px solid transparent; transition:all .12s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .name-chip:hover { border-color:var(--primary); background:var(--primary-light); color:var(--primary); }
    .name-chip-sub { font-size:10px; color:var(--text-muted); display:block; line-height:1.3; }

    /* 학생 상세 팝업 */
    .popup-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; align-items:center; justify-content:center; }
    .popup-ov.show { display:flex; }
    .popup-bx { background:var(--card); border-radius:14px; width:320px; box-shadow:0 16px 48px rgba(0,0,0,.25); }
    .popup-hd { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .popup-bd { padding:16px 20px; }
    .info-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
    .info-row:last-child { border-bottom:none; }
    .info-lbl { color:var(--text-muted); font-size:12px; }
    .info-val { font-weight:600; }
    .call-btn { background:none; border:1px solid var(--border); border-radius:6px; padding:3px 10px; font-size:12px; cursor:pointer; color:var(--primary); margin-left:8px; }
    .call-btn:hover { background:var(--primary-light); }

    /* 기타 */
    .empty { text-align:center; padding:48px 16px; color:var(--text-sub); }
    .pw-dot { color:var(--text-muted); letter-spacing:2px; }
    .toggle-pw { background:none; border:none; color:var(--primary); font-size:12px; cursor:pointer; margin-left:6px; }

    /* 다크모드 */
    body.dark .login-screen { background:#0f1623; }
    body.dark .tbl thead th { background:#161b27 !important; color:#64748b !important; border-color:#2a3347 !important; }
    body.dark .tbl tbody tr:hover { background:#1e2536 !important; }
    body.dark .nav-btn.active { background:#1e2536; color:#818cf8; }
    body.dark .card-c { border-color:#334155 !important; }
    body.dark .class-block { border-color:#2a3347 !important; background:#1a2235 !important; }
    body.dark .sec-box { background:#1e293b !important; border-color:#2a3347 !important; }
    body.dark .prog { background:#2a3347; }
    body.dark .teacher-tab { background:var(--card); border-color:var(--border); }
    body.dark .teacher-tab.active { background:#1e1b4b; border-color:#818cf8; }

    /* 모바일 */
    .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:99; }
    .sidebar-overlay.show { display:block; }
    @media (max-width:768px) {
      .sidebar { transform:translateX(-220px); width:220px !important; transition:transform .25s,box-shadow .25s; }
      .sidebar.open { transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.35); }
      .sidebar.collapsed { transform:translateX(-220px); }
      .main { margin-left:0 !important; padding:14px 12px !important; }
      .sidebar-toggle-ext { display:flex !important; }
    }
  </style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div style="font-size:44px;margin-bottom:12px">🛡️</div>
    <h5 style="font-weight:700;margin-bottom:4px">관리자 대시보드</h5>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:24px">관리자 비밀번호를 입력해주세요</p>
    <input type="password" class="fc" id="pwInput" placeholder="비밀번호" style="margin-bottom:12px" onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pwErr" style="display:none;color:#ef4444;font-size:13px;margin-bottom:8px">비밀번호가 올바르지 않습니다</div>
    <button class="btn-p" style="width:100%;padding:12px" onclick="checkPw()">로그인</button>
  </div>
</div>

<div class="toast-c" id="toastC"></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<button class="sidebar-toggle-ext" id="sidebarToggleExt" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>

<!-- 학생 상세 팝업 -->
<div class="popup-ov" id="stuPopup" onclick="if(event.target===this)closeStuPopup()">
  <div class="popup-bx">
    <div class="popup-hd">
      <span style="font-weight:700;font-size:16px" id="popupTitle">학생 정보</span>
      <button class="btn-o" style="padding:4px 10px" onclick="closeStuPopup()">✕</button>
    </div>
    <div class="popup-bd" id="popupBody"></div>
  </div>
</div>

<div id="mainWrap" style="display:none">

  <!-- 사이드바 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div>🛡️ 관리자<span>관리자 대시보드</span></div>
      <button class="hamburger-btn" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
    </div>
    <nav style="padding:12px 0">
      <button class="nav-btn active" id="nav-classes" onclick="showPage('classes')">🏫 반별 현황</button>
      <button class="nav-btn" id="nav-manage" onclick="showPage('manage')">👤 선생님 관리</button>
    </nav>
    <div style="position:absolute;bottom:16px;left:0;right:0;padding:0 8px;display:flex;flex-direction:column;gap:6px">
      <button onclick="goToTeacher()" style="display:block;width:100%;background:var(--primary-light);color:var(--primary);text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;border:none;cursor:pointer">📚 선생님 대시보드</button>
      <button onclick="toggleDark()" id="darkToggleBtn" style="border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:9px;font-size:13px;cursor:pointer;width:100%;white-space:nowrap">🌙 다크 모드</button>
      <button onclick="doLogout()" style="border:1px solid var(--border);background:var(--card);color:var(--text-muted);border-radius:8px;padding:9px;font-size:12px;cursor:pointer;width:100%;white-space:nowrap">🔓 로그아웃</button>
    </div>
  </div>

  <!-- 메인 -->
  <div class="main" id="mainArea">

    <!-- 반별 현황 -->
    <div class="page active" id="page-classes">
      <div class="page-title">🏫 반별 현황</div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
        <input type="date" class="fc" id="dateInput" style="width:160px" onchange="onDateChange()">
        <button class="btn-p" onclick="loadAll()">🔄 새로고침</button>
        <span id="dateLabel" style="font-size:13px;color:var(--text-muted)"></span>
      </div>

      <div id="teacherTabs" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px"></div>
      <div id="classesList"></div>
    </div>

    <!-- 선생님 관리 -->
    <div class="page" id="page-manage">
      <div class="page-title">👤 선생님 관리</div>
      <div class="page-sub">선생님 계정을 추가하거나 삭제합니다</div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button class="btn-p" onclick="openAddModal()">+ 선생님 추가</button>
      </div>
      <div class="card-c">
        <table class="tbl">
          <thead>
            <tr><th>이름</th><th>권한</th><th>비밀번호</th><th>담당 학생</th><th>관리</th></tr>
          </thead>
          <tbody id="teacherTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 선생님 추가 모달 -->
<div class="modal-ov" id="addModal" onclick="if(event.target===this)closeAddModal()">
  <div class="modal-bx">
    <div class="modal-hd">
      <span style="font-weight:700;font-size:16px">선생님 추가</span>
      <button class="btn-o" style="padding:4px 10px" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-bd">
      <div class="mb-3">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">이름 *</label>
        <input type="text" class="fc" id="newName" placeholder="선생님 이름">
      </div>
      <div class="mb-3">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">비밀번호 *</label>
        <input type="text" class="fc" id="newPw" placeholder="숫자 4자리 이상">
      </div>
      <div id="addErr" style="display:none;color:#ef4444;font-size:13px"></div>
    </div>
    <div class="modal-ft">
      <button class="btn-o" onclick="closeAddModal()">취소</button>
      <button class="btn-p" onclick="doAddTeacher()">추가</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://umvblxlwllgpypxhtpcp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtdmJseGx3bGxncHlweGh0cGNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MzQ2ODUsImV4cCI6MjA5MDUxMDY4NX0.yTXix8cAm0iyL2E1RoO2zpmfzUq7BePV_PFKDkz_IjU';
const ADMIN_KEY = 'adminAuth_v1';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let _teachers = [], _students = [], _homeworks = [], _submissions = {}, _extensions = [];
let _selectedTeacher = null;
// 연장 정보 맵: homework_id -> student_id -> {reason, requested_until, requested_time, source}
let _extMap = {};

/* ── 다크모드 ── */
function toggleDark() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('adminDark', isDark ? '1' : '0');
  document.getElementById('darkToggleBtn').textContent = isDark ? '☀️ 라이트 모드' : '🌙 다크 모드';
}
if (localStorage.getItem('adminDark') === '1') {
  document.body.classList.add('dark');
  document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('darkToggleBtn');
    if (b) b.textContent = '☀️ 라이트 모드';
  });
}

/* ── 사이드바 ── */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('mainArea');
  const ov = document.getElementById('sidebarOverlay');
  if (window.innerWidth <= 768) { sb.classList.toggle('open'); ov.classList.toggle('show'); }
  else { sb.classList.toggle('collapsed'); main.classList.toggle('expanded'); }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

/* ── Toast ── */
function toast(msg, type) {
  const c = document.getElementById('toastC');
  const el = document.createElement('div');
  el.className = 'toast-i';
  el.style.borderLeft = '4px solid ' + (type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#4f46e5');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* ── 로그인 ── */
async function checkPw() {
  const v = document.getElementById('pwInput').value;
  if (!v) return;
  const { data } = await db.from('teachers').select('*').eq('password', v).eq('is_admin', true).single();
  if (data) {
    localStorage.setItem(ADMIN_KEY, '1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainWrap').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('pwErr').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
}
function doLogout() { localStorage.removeItem(ADMIN_KEY); location.reload(); }
function goToTeacher() {
  // 관리자 세션이 남아있으면 teacher.html이 다시 admin으로 튕기므로, 선생님 세션 키를 비우고 이동
  localStorage.removeItem('teacherAuth_v2');
  location.href = 'teacher.html';
}
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (localStorage.getItem(ADMIN_KEY) === '1') {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainWrap').style.display = 'block';
  document.addEventListener('DOMContentLoaded', () => { initDateInput(); loadAll(); });
}

/* ── 페이지 전환 ── */
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (window.innerWidth <= 768) closeSidebar();
}

/* ── 날짜 ── */
function getTodayKST() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}
function initDateInput() {
  const inp = document.getElementById('dateInput');
  if (inp && !inp.value) inp.value = getTodayKST();
}
function getSelectedDate() {
  return document.getElementById('dateInput')?.value || getTodayKST();
}
async function onDateChange() {
  await loadHomeworks();
  await Promise.all([loadSubmissions(), loadExtensions()]);
  renderTeacherTabs();
  renderClasses();
}

/* ── 데이터 로드 ── */
async function loadAll() {
  initDateInput();
  await Promise.all([loadTeachers(), loadStudents(), loadHomeworks()]);
  await Promise.all([loadSubmissions(), loadExtensions()]);
  renderTeacherTabs();
  renderClasses();
  renderTeacherTable();
}
async function loadTeachers() {
  const { data } = await db.from('teachers').select('*').order('created_at');
  _teachers = data || [];
}
async function loadStudents() {
  const { data } = await db.from('students').select('id, name, class, phone, teacher_name').order('teacher_name').order('class');
  _students = data || [];
}
async function loadHomeworks() {
  const date = getSelectedDate();
  const lbl = document.getElementById('dateLabel');
  if (lbl) lbl.textContent = date + ' 마감 기준';
  const { data } = await db.from('homeworks').select('*, homework_classes(*)').eq('due_date', date);
  _homeworks = data || [];
}
async function loadSubmissions() {
  _submissions = {};
  if (!_homeworks.length) return;
  const ids = _homeworks.map(h => h.id);
  const { data } = await db.from('submissions').select('homework_id, student_id, submitted').in('homework_id', ids);
  (data || []).forEach(s => {
    if (!_submissions[s.homework_id]) _submissions[s.homework_id] = {};
    _submissions[s.homework_id][s.student_id] = s.submitted;
  });
}
async function loadExtensions() {
  _extensions = []; _extMap = {};
  if (!_homeworks.length) return;
  const ids = _homeworks.map(h => h.id);
  const { data } = await db.from('extension_requests')
    .select('student_id, homework_id, status, reason, requested_until, requested_time, source')
    .in('homework_id', ids);
  _extensions = data || [];
  // 맵 구성
  _extensions.forEach(e => {
    if (!_extMap[e.homework_id]) _extMap[e.homework_id] = {};
    _extMap[e.homework_id][e.student_id] = e;
  });
}

/* ── 선생님 탭 ── */
function calcTeacherRate(teacher) {
  const myStu = _students.filter(s => s.teacher_name === teacher.name);
  const myClasses = [...new Set(myStu.map(s => s.class))];
  let asgn = 0, sub = 0;
  myClasses.forEach(cls => {
    const clsStu = myStu.filter(s => s.class === cls);
    const clsHws = _homeworks.filter(hw => (hw.homework_classes || []).some(hc => hc.class_name === cls));
    clsStu.forEach(stu => clsHws.forEach(hw => { asgn++; if (_submissions[hw.id]?.[stu.id]) sub++; }));
  });
  return asgn ? Math.round(sub / asgn * 100) : null;
}
function renderTeacherTabs() {
  const tabsEl = document.getElementById('teacherTabs');
  const nonAdmins = _teachers.filter(t => !t.is_admin);
  if (!nonAdmins.length) { tabsEl.innerHTML = ''; return; }
  if (!_selectedTeacher || !nonAdmins.find(t => t.name === _selectedTeacher)) _selectedTeacher = nonAdmins[0].name;
  tabsEl.innerHTML = nonAdmins.map(t => {
    const rate = calcTeacherRate(t);
    const rc = rate === null ? 'var(--text-muted)' : rate >= 80 ? '#10b981' : rate >= 50 ? '#f59e0b' : '#ef4444';
    const active = t.name === _selectedTeacher;
    return '<button class="teacher-tab' + (active ? ' active' : '') + '" onclick="selectTeacher(\'' + t.name + '\')">'
      + '👤 ' + t.name + 'T'
      + '<span style="font-size:12px;font-weight:700;color:' + rc + '">' + (rate !== null ? rate + '%' : '숙제없음') + '</span>'
      + '</button>';
  }).join('');
}
function selectTeacher(name) {
  _selectedTeacher = name;
  renderTeacherTabs();
  renderClasses();
}

/* ── 반별 현황 렌더링 ── */
function renderClasses() {
  const container = document.getElementById('classesList');
  const date = getSelectedDate();

  if (!_homeworks.length) {
    container.innerHTML = '<div class="empty"><div style="font-size:48px;opacity:.35;margin-bottom:12px">📭</div>'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:4px">' + date + ' 숙제가 없습니다</div>'
      + '<div style="font-size:13px;color:var(--text-muted)">해당 날짜 마감인 숙제가 없어요</div></div>';
    return;
  }
  const nonAdmins = _teachers.filter(t => !t.is_admin);
  const teacher = nonAdmins.find(t => t.name === _selectedTeacher) || nonAdmins[0];
  if (!teacher) { container.innerHTML = '<div class="empty">등록된 선생님이 없습니다</div>'; return; }

  const myStu = _students.filter(s => s.teacher_name === teacher.name);
  const myClasses = [...new Set(myStu.map(s => s.class))].sort();

  let totalAsgn = 0, totalSub = 0;
  myClasses.forEach(cls => {
    const clsStu = myStu.filter(s => s.class === cls);
    const clsHws = _homeworks.filter(hw => (hw.homework_classes || []).some(hc => hc.class_name === cls));
    clsStu.forEach(stu => clsHws.forEach(hw => { totalAsgn++; if (_submissions[hw.id]?.[stu.id]) totalSub++; }));
  });

  if (!totalAsgn) {
    container.innerHTML = '<div class="empty" style="padding:40px">'
      + '<div style="font-size:32px;margin-bottom:8px">📭</div>'
      + '<div style="font-weight:600">' + teacher.name + 'T 담당 반에 ' + date + ' 숙제가 없습니다</div></div>';
    return;
  }

  const overallRate = Math.round(totalSub / totalAsgn * 100);
  const rateColor = overallRate >= 80 ? '#10b981' : overallRate >= 50 ? '#f59e0b' : '#ef4444';

  // 요약 배너
  let html = '<div class="card-c"><div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<span class="summary-chip">학생 ' + myStu.length + '명</span>'
    + '<span class="summary-chip">반 ' + myClasses.length + '개</span>'
    + '</div>'
    + '<div style="display:flex;align-items:center;gap:10px">'
    + '<div class="prog" style="width:120px"><div class="prog-f" style="width:' + overallRate + '%;background:' + rateColor + '"></div></div>'
    + '<span style="font-size:18px;font-weight:700;color:' + rateColor + '">' + overallRate + '%</span>'
    + '<span style="font-size:13px;color:var(--text-muted)">전체 제출률</span>'
    + '</div></div></div>';

  // 반별 블록
  myClasses.forEach(cls => {
    const clsStu = myStu.filter(s => s.class === cls);
    const clsHws = _homeworks.filter(hw => (hw.homework_classes || []).some(hc => hc.class_name === cls));
    if (!clsHws.length) return;

    // 연장 신청한 학생 (homework별 extMap에서)
    const extStudentIds = new Set();
    clsHws.forEach(hw => {
      if (_extMap[hw.id]) Object.keys(_extMap[hw.id]).forEach(sid => extStudentIds.add(sid));
    });

    // 제출 완료 (연장 신청 없이 제출)
    const submitted = clsStu.filter(s =>
      clsHws.some(hw => _submissions[hw.id]?.[s.id])
    );
    // 연장 신청
    const extended = clsStu.filter(s => extStudentIds.has(s.id));
    // 미제출 (연장 없고 제출도 없음)
    const notSubmitted = clsStu.filter(s =>
      !extStudentIds.has(s.id) && clsHws.every(hw => !_submissions[hw.id]?.[s.id])
    );

    let clsAsgn = 0, clsSub = 0;
    clsStu.forEach(stu => clsHws.forEach(hw => {
      clsAsgn++; if (_submissions[hw.id]?.[stu.id]) clsSub++;
    }));
    const clsRate = clsAsgn ? Math.round(clsSub / clsAsgn * 100) : 0;
    const clsRateColor = clsRate >= 80 ? '#10b981' : clsRate >= 50 ? '#f59e0b' : '#ef4444';

    // 제출 이름 그리드
    const subNames = submitted.map(s =>
      '<button class="name-chip" onclick="showStuPopup(\'' + s.id + '\',\'sub\')" '
      + 'style="background:#f0fdf4;color:#166534;border-color:#bbf7d0;text-align:left">' + s.name + '</button>'
    ).join('');

    // 연장 이름 그리드 (이름 + 간단 정보)
    const extNames = extended.map(s => {
      // 첫 번째 관련 hw의 연장 정보
      let extInfo = null;
      for (const hw of clsHws) {
        if (_extMap[hw.id]?.[s.id]) { extInfo = _extMap[hw.id][s.id]; break; }
      }
      const brief = extInfo ? (' ~' + (extInfo.requested_until || '').slice(5).replace('-', '/')) : '';
      const reason = extInfo && extInfo.reason ? extInfo.reason.slice(0, 6) + (extInfo.reason.length > 6 ? '…' : '') : '';
      return '<button class="name-chip" onclick="showStuPopup(\'' + s.id + '\',\'ext\')" '
        + 'style="background:#fefce8;color:#92400e;border-color:#fde68a;text-align:left">'
        + s.name
        + (brief ? '<span class="name-chip-sub">' + brief + (reason ? ' · ' + reason : '') + '</span>' : '')
        + '</button>';
    }).join('');

    // 미제출 이름 그리드
    const notNames = notSubmitted.map(s =>
      '<button class="name-chip" onclick="showStuPopup(\'' + s.id + '\',\'miss\')" '
      + 'style="background:#fef2f2;color:#991b1b;border-color:#fecaca;text-align:left">' + s.name + '</button>'
    ).join('');

    html += '<div class="class-block">'
      // 헤더
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
      + '<span style="font-weight:700;font-size:15px">' + cls
      + ' <span style="font-weight:400;font-size:12px;color:var(--text-muted)">' + clsStu.length + '명</span></span>'
      + '<div style="display:flex;align-items:center;gap:8px">'
      + '<div class="prog" style="width:80px"><div class="prog-f" style="width:' + clsRate + '%;background:' + clsRateColor + '"></div></div>'
      + '<span style="font-size:13px;font-weight:700;color:' + clsRateColor + ';min-width:32px;text-align:right">' + clsRate + '%</span>'
      + '</div></div>'
      // 3분할
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
      // 제출
      + '<div class="sec-box"><div class="sec-label" style="color:#166534">✅ 제출 (' + submitted.length + '명)</div>'
      + '<div class="name-grid">' + (subNames || '<span style="font-size:12px;color:var(--text-muted)">없음</span>') + '</div></div>'
      // 연장
      + '<div class="sec-box"><div class="sec-label" style="color:#92400e">⏳ 연장 (' + extended.length + '명)</div>'
      + '<div class="name-grid">' + (extNames || '<span style="font-size:12px;color:var(--text-muted)">없음</span>') + '</div></div>'
      // 미제출
      + '<div class="sec-box"><div class="sec-label" style="color:#991b1b">❌ 미제출 (' + notSubmitted.length + '명)</div>'
      + '<div class="name-grid">' + (notNames || '<span style="font-size:12px;color:var(--text-muted)">없음</span>') + '</div></div>'
      + '</div></div>';
  });

  container.innerHTML = html;
}

/* ── 학생 팝업 ── */
const TIMES = {'10:00':'오전 10시','12:00':'낮 12시','18:00':'오후 6시','22:00':'밤 10시','23:59':'밤 12시'};

function showStuPopup(stuId, mode) {
  const stu = _students.find(s => s.id === stuId);
  if (!stu) return;

  const title = document.getElementById('popupTitle');
  const body = document.getElementById('popupBody');
  const phoneHtml = (label, phone) => {
    const num = (phone || '').trim();
    return '<div class="info-row">'
      + '<span class="info-lbl">' + label + '</span>'
      + '<div style="display:flex;align-items:center">'
      + '<span class="info-val">' + (num || '없음') + '</span>'
      + (num ? '<a href="tel:' + num + '" class="call-btn">📞 전화</a>' : '')
      + '</div></div>';
  };

  if (mode === 'ext') {
    // 연장 신청 팝업
    title.textContent = '⏳ 연장 신청 · ' + stu.name;
    // 해당 학생의 연장 정보 찾기
    let extInfo = null;
    for (const hw of _homeworks) {
      if (_extMap[hw.id]?.[stuId]) { extInfo = _extMap[hw.id][stuId]; break; }
    }
    const until = extInfo?.requested_until || '-';
    const time = TIMES[extInfo?.requested_time] || extInfo?.requested_time || '';
    const reason = extInfo?.reason || '-';
    const isParent = extInfo?.source === 'parent';

    body.innerHTML = '<div class="info-row"><span class="info-lbl">신청자</span>'
      + '<span class="info-val">' + stu.name + (isParent ? ' <span style="background:#dbeafe;color:#1e40af;padding:1px 7px;border-radius:8px;font-size:11px;font-weight:700;margin-left:4px">학부모 신청</span>' : '') + '</span></div>'
      + '<div class="info-row"><span class="info-lbl">연장 기한</span><span class="info-val" style="color:var(--primary)">' + until + (time ? ' ' + time : '') + '</span></div>'
      + '<div class="info-row"><span class="info-lbl">사유</span><span class="info-val" style="font-weight:400;font-size:13px;max-width:180px;text-align:right">' + reason + '</span></div>'
      + '<div style="margin:10px 0;border-top:1px solid var(--border)"></div>'
      + phoneHtml('학생 전화', stu.phone);
  } else if (mode === 'miss') {
    title.textContent = '❌ 미제출 · ' + stu.name;
    body.innerHTML = '<div class="info-row"><span class="info-lbl">반</span><span class="info-val">' + stu.class + '</span></div>'
      + phoneHtml('학생 전화', stu.phone);
  } else {
    title.textContent = '✅ 제출 완료 · ' + stu.name;
    body.innerHTML = '<div class="info-row"><span class="info-lbl">반</span><span class="info-val">' + stu.class + '</span></div>'
      + phoneHtml('학생 전화', stu.phone);
  }

  document.getElementById('stuPopup').classList.add('show');
}
function closeStuPopup() { document.getElementById('stuPopup').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStuPopup(); });

/* ── 선생님 관리 ── */
function renderTeacherTable() {
  const tbody = document.getElementById('teacherTableBody');
  if (!_teachers.length) { tbody.innerHTML = '<tr><td colspan="5" class="empty">선생님이 없습니다</td></tr>'; return; }
  tbody.innerHTML = _teachers.map(t => {
    const stuCount = _students.filter(s => s.teacher_name === t.name).length;
    const canDelete = !t.is_admin && stuCount === 0;
    return '<tr>'
      + '<td style="font-weight:600">' + t.name + '</td>'
      + '<td>' + (t.is_admin ? '<span class="badge-admin">관리자</span>' : '<span class="badge-teacher">선생님</span>') + '</td>'
      + '<td><span id="pw_' + t.id + '" class="pw-dot">••••</span>'
      + '<button class="toggle-pw" onclick="togglePw(\'' + t.id + '\',\'' + t.password + '\')">보기</button></td>'
      + '<td>' + stuCount + '명</td>'
      + '<td>' + (t.is_admin ? '-'
        : '<button class="btn-d" onclick="doDelete(\'' + t.id + '\',\'' + t.name + '\',' + stuCount + ')"'
          + (!canDelete ? ' style="opacity:.4;cursor:not-allowed" title="학생이 있으면 삭제할 수 없습니다"' : '') + '>삭제</button>') + '</td>'
      + '</tr>';
  }).join('');
}
function togglePw(id, pw) {
  const el = document.getElementById('pw_' + id);
  if (el.textContent === '••••') { el.textContent = pw; el.style.color = 'var(--text)'; }
  else { el.textContent = '••••'; el.style.color = ''; }
}

function openAddModal() {
  document.getElementById('newName').value = '';
  document.getElementById('newPw').value = '';
  document.getElementById('addErr').style.display = 'none';
  document.getElementById('addModal').classList.add('show');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }

async function doAddTeacher() {
  const name = document.getElementById('newName').value.trim();
  const pw = document.getElementById('newPw').value.trim();
  const errEl = document.getElementById('addErr');
  errEl.style.display = 'none';
  if (!name) { errEl.textContent = '이름을 입력해주세요'; errEl.style.display = 'block'; return; }
  if (!pw || pw.length < 4) { errEl.textContent = '비밀번호는 4자 이상이어야 합니다'; errEl.style.display = 'block'; return; }
  if (_teachers.some(t => t.name === name)) { errEl.textContent = '이미 존재하는 이름입니다'; errEl.style.display = 'block'; return; }
  const { error } = await db.from('teachers').insert({ name, password: pw, is_admin: false });
  if (error) { errEl.textContent = '오류: ' + error.message; errEl.style.display = 'block'; return; }
  closeAddModal();
  toast(name + ' 선생님이 추가됐습니다', 'success');
  await loadAll();
}
async function doDelete(id, name, stuCount) {
  if (stuCount > 0) { alert(name + ' 선생님 담당 학생이 ' + stuCount + '명 있어서 삭제할 수 없어요.\n먼저 학생을 다른 선생님에게 이전하거나 삭제해주세요.'); return; }
  if (!confirm(name + ' 선생님을 삭제하시겠습니까?')) return;
  await db.from('teachers').delete().eq('id', id);
  toast(name + ' 선생님이 삭제됐습니다', 'success');
  await loadAll();
}
</script>
